<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-label="FTO 复核优先级" class="rv-svg">
<title>FTO 复核优先级</title>
<rect width="760" height="190" rx="16" fill="var(--surface,#fff)"/>
<text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="var(--ink,#17233b)">FTO 复核优先级</text>
<text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="var(--muted,#71809a)">按 fto-candidate-ranking.csv 的 review_priority 统计（状态色板）；是复核队列，不是侵权概率。</text>
<g class="rv-row">
<title>HIGH: 23</title>
<text x="28" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="var(--secondary,#44536c)">HIGH</text>
<rect x="210" y="77" width="466" height="18" rx="9" fill="var(--track,#edf2fa)"/>
<rect class="rv-bar" x="210" y="77" width="466.0" height="18" rx="9" fill="#0ca30c"><animate attributeName="width" from="0" to="466.0" dur=".5s" fill="freeze"/></rect>
<text x="706" y="90" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="var(--ink,#17233b)">23</text>
</g>
<g class="rv-row">
<title>MEDIUM: 2</title>
<text x="28" y="124" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="var(--secondary,#44536c)">MEDIUM</text>
<rect x="210" y="111" width="466" height="18" rx="9" fill="var(--track,#edf2fa)"/>
<rect class="rv-bar" x="210" y="111" width="40.5" height="18" rx="9" fill="#fab219"><animate attributeName="width" from="0" to="40.5" dur=".5s" fill="freeze"/></rect>
<text x="706" y="124" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="var(--ink,#17233b)">2</text>
</g>
</svg>