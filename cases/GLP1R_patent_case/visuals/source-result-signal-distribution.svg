<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-label="公开来源响应信号">
<title>公开来源响应信号</title>
<desc>对已执行来源按页面响应信号统计；不把启发式数字当作正式命中总数。</desc>
<rect width="760" height="338" rx="16" fill="#ffffff"/>
<text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#17233b">公开来源响应信号</text>
<text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#71809a">对已执行来源按页面响应信号统计；不把启发式数字当作正式命中总数。</text>
<circle cx="172" cy="156" r="78" fill="none" stroke="#edf2fa" stroke-width="28"/>
<text x="172" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#17233b">0</text>
<text x="172" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#71809a">总记录</text>
<text x="70" y="275" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#71809a">当前数据集暂无可绘制记录</text>
</svg>