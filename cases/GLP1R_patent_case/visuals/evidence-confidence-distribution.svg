<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-label="证据置信度分布">
<title>证据置信度分布</title>
<desc>按 evidence.csv 的 confidence 字段统计。</desc>
<rect width="760" height="338" rx="16" fill="#ffffff"/>
