<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-label="状态信号分布">
<title>状态信号分布</title>
<desc>把官方状态和状态来源文字归入研究阶段信号，不替代官方法律状态。</desc>
<rect width="760" height="338" rx="16" fill="#ffffff"/>
<text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#17233b">状态信号分布</text>
<text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#71809a">把官方状态和状态来源文字归入研究阶段信号，不替代官方法律状态。</text>
<circle cx="172" cy="156" r="78" fill="none" stroke="#edf2fa" stroke-width="28"/>
<circle cx="172" cy="156" r="78" fill="none" stroke="#e3655b" stroke-width="28" stroke-dasharray="294.05 196.04" stroke-dashoffset="-0.00" transform="rotate(-90 172 156)"/>
<circle cx="172" cy="156" r="78" fill="none" stroke="#6d7892" stroke-width="28" stroke-dasharray="196.04 294.05" stroke-dashoffset="-294.05" transform="rotate(-90 172 156)"/>
<text x="172" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#17233b">20</text>
<text x="172" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#71809a">总记录</text>
<rect x="340" y="76" width="12" height="12" rx="3" fill="#e3655b"/>
<text x="362" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">授权/状态较强</text>
<text x="710" y="86" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#17233b">12 · 60%</text>
<rect x="340" y="100" width="12" height="12" rx="3" fill="#6d7892"/>
<text x="362" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">公开/待审查</text>
<text x="710" y="110" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#17233b">8 · 40%</text>
</svg>