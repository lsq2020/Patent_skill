<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" role="img" aria-label="证据置信度分布" class="rv-svg">
<title>证据置信度分布</title>
<rect width="760" height="246" rx="16" fill="var(--surface,#fff)"/>
<text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="var(--ink,#17233b)">证据置信度分布</text>
<text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="var(--muted,#71809a)">按 evidence.csv 的 confidence 字段统计（状态色板）。</text>
<g class="rv-row">
<title>medium: 16</title>
<text x="28" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="var(--secondary,#44536c)">medium</text>
<rect x="210" y="77" width="466" height="18" rx="9" fill="var(--track,#edf2fa)"/>
<rect class="rv-bar" x="210" y="77" width="466.0" height="18" rx="9" fill="#fab219"><animate attributeName="width" from="0" to="466.0" dur=".5s" fill="freeze"/></rect>
<text x="706" y="90" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="var(--ink,#17233b)">16</text>
</g>
<g class="rv-row">
<title>high: 5</title>
<text x="28" y="124" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="var(--secondary,#44536c)">high</text>
<rect x="210" y="111" width="466" height="18" rx="9" fill="var(--track,#edf2fa)"/>
<rect class="rv-bar" x="210" y="111" width="145.6" height="18" rx="9" fill="#0ca30c"><animate attributeName="width" from="0" to="145.6" dur=".5s" fill="freeze"/></rect>
<text x="706" y="124" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="var(--ink,#17233b)">5</text>
</g>
<g class="rv-row">
<title>direct_fact: 3</title>
<text x="28" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="var(--secondary,#44536c)">direct_fact</text>
<rect x="210" y="145" width="466" height="18" rx="9" fill="var(--track,#edf2fa)"/>
<rect class="rv-bar" x="210" y="145" width="87.4" height="18" rx="9" fill="#fab219"><animate attributeName="width" from="0" to="87.4" dur=".5s" fill="freeze"/></rect>
<text x="706" y="158" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="var(--ink,#17233b)">3</text>
</g>
<g class="rv-row">
<title>low: 2</title>
<text x="28" y="192" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="var(--secondary,#44536c)">low</text>
<rect x="210" y="179" width="466" height="18" rx="9" fill="var(--track,#edf2fa)"/>
<rect class="rv-bar" x="210" y="179" width="58.2" height="18" rx="9" fill="#ec835a"><animate attributeName="width" from="0" to="58.2" dur=".5s" fill="freeze"/></rect>
<text x="706" y="192" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="var(--ink,#17233b)">2</text>
</g>
</svg>