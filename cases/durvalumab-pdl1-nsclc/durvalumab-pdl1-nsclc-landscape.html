<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>度伐利尤单抗—PD-L1—NSCLC 专利族景观</title>
<style>
:root{--ink:#18202b;--muted:#637083;--line:#dfe5ec;--blue:#155eef;--blue-soft:#eaf1ff;--teal:#008a8a;--amber:#b77900;--bg:#f6f8fb;--surface:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1280px;margin:0 auto;padding:28px 22px 50px}header{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:28px;margin:0 0 5px}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted)}.notice{background:#fff8e6;border:1px solid #f0d48a;border-radius:10px;padding:11px 13px;color:#6d5000;margin-bottom:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:150px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}.metric{padding:14px 16px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:26px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:17px;margin-bottom:16px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #edf0f4;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:500}a{color:var(--blue);text-decoration:none}.tag{display:inline-block;background:var(--blue-soft);color:#174ea6;border-radius:999px;padding:2px 7px;font-size:11px;margin-right:4px}.tag.teal{background:#e2f7f7;color:#087575}.tag.amber{background:#fff1cc;color:#7a5600}
.timeline{display:grid;gap:9px}.tr{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}.track{display:flex;align-items:center;gap:8px;border-bottom:1px solid #edf0f4;min-height:28px}.dot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}.dot.resistance{background:var(--teal);box-shadow:0 0 0 4px #e2f7f7}.dot.watch{background:var(--amber);box-shadow:0 0 0 4px #fff1cc}
.roadmap{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.node{background:var(--blue-soft);border:1px solid #c9d9ff;border-radius:9px;padding:9px;text-align:center}.arrow{font-size:20px;color:var(--muted)}.foot{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}header{display:block}}@media(max-width:560px){main{padding:18px 12px}.family-table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head><body><main>
<header><div><h1>度伐利尤单抗—PD-L1—NSCLC 专利族景观</h1><p class="muted">可复核专利族景观；支持按技术主题、法域和状态筛选。</p></div><div class="muted">案例快照<br>2026-08-06</div></header>
<div class="notice">状态和风险为研究快照，不构成法律意见或 FTO 结论。来源应回到专利文本和目标法域官方登记簿复核。</div>
<div class="controls"><label>技术主题<select id="theme"><option value="all">全部</option><option value="compound">化合物</option><option value="formulation">制剂</option><option value="indication">适应症/联合</option><option value="resistance">耐药/突变</option></select></label><label>法域<select id="juris"><option value="all">全部</option><option value="CN">中国</option><option value="US">美国</option><option value="WO">国际/PCT</option><option value="EP">欧洲</option></select></label><label>状态<select id="status"><option value="all">全部</option><option value="grant">授权记录</option><option value="pending">公开/审查中</option><option value="watch">观察项</option></select></label></div>
<section class="metrics" id="metrics"></section>
<div class="grid"><section class="panel"><h2>优先权时间线</h2><div class="timeline" id="timeline"></div><p class="foot">同一专利族按 family_id 计数，不把国家成员重复计为独立创新。</p></section>
<section class="panel"><h2>通用技术路线</h2><div class="roadmap"><div class="node">疾病/未满足需求</div><div class="arrow">→</div><div class="node">靶点与机制</div><div class="arrow">→</div><div class="node">化合物/候选物</div><div class="arrow">→</div><div class="node">适应症/方案</div><div class="arrow">→</div><div class="node">耐药/下一代技术</div></div><p class="foot">每个节点应回溯到 family_id、claim 要素或上下文证据。</p></section>
<section class="panel full"><h2>专利族明细</h2><table class="family-table"><thead><tr><th>族</th><th>代表文献</th><th>技术主题</th><th>优先权</th><th>法域</th><th>状态</th><th>申请人</th></tr></thead><tbody id="families"></tbody></table></section></div>
</main><script>const data=[{"id": "DVL-FAM-001", "doc": "US9493565B2", "title": "Fc-optimized anti-PD-L1 antibody (durvalumab/MEDI4736) composition and sequence", "theme": "indication", "year": "2009", "juris": ["CN", "US", "WO", "EP"], "status": "grant", "applicant": "MedImmune Ltd / AstraZeneca AB", "mutation": "", "status_note": "US public mirror shows active; CN and other national members require official-register review", "url": "https://patents.google.com/patent/US9493565B2/en"}, {"id": "DVL-FAM-002", "doc": "US20190256603A1", "title": "Durvalumab plus tremelimumab for selected NSCLC patients", "theme": "indication", "year": "2016", "juris": ["CN", "US", "WO", "EP", "JP"], "status": "pending", "applicant": "MedImmune LLC / AstraZeneca AB", "mutation": "PD-L1-negative; high CD8+ TILs", "status_note": "US application shown abandoned; CN member shown pending on public mirror; family legal state differs by jurisdiction", "url": "https://patents.google.com/patent/US20190256603A1/en"}, {"id": "DVL-FAM-003", "doc": "WO2024213696A1", "title": "Durvalumab plus platinum chemotherapy for resectable NSCLC", "theme": "indication", "year": "2023", "juris": ["WO"], "status": "watch", "applicant": "AstraZeneca AB", "mutation": "", "status_note": "WO publication; CN/US national-phase status not established in this screening", "url": "https://patents.google.com/patent/WO2024213696A1/en"}, {"id": "DVL-FAM-004", "doc": "WO2022248478A1", "title": "Durvalumab/PD-1-axis inhibition with concurrent platinum-based chemoradiation for unresectable stage III NSCLC", "theme": "indication", "year": "2021", "juris": ["CN", "US", "WO", "EP"], "status": "pending", "applicant": "AstraZeneca AB", "mutation": "", "status_note": "CN117425493A and US20240254235A1 shown published/pending on public mirror; official register review required", "url": "https://patents.google.com/patent/WO2022248478A1/en"}, {"id": "DVL-FAM-005", "doc": "US20210054079A1", "title": "Human anti-PD-L1 antibody formulation including durvalumab-relevant formulation disclosure", "theme": "formulation", "year": "2018", "juris": ["US"], "status": "watch", "applicant": "MedImmune Ltd", "mutation": "", "status_note": "US application shown abandoned on public mirror", "url": "https://patents.google.com/patent/US20210054079A1/en"}, {"id": "DVL-FAM-006", "doc": "WO2019165434A1", "title": "Anti-TIGIT plus anti-PD-L1 antagonist dosing", "theme": "indication", "year": "2018", "juris": ["CN", "US", "WO", "EP", "JP"], "status": "watch", "applicant": "F. Hoffmann-La Roche AG / Genentech Inc", "mutation": "", "status_note": "WO record shown ceased; national status differs by jurisdiction", "url": "https://patents.google.com/patent/WO2019165434A1/en"}, {"id": "DVL-FAM-007", "doc": "WO2024234348A1", "title": "Biomarker for immune checkpoint blockade therapy in NSCLC", "theme": "resistance", "year": "2023", "juris": ["WO"], "status": "pending", "applicant": "Individual applicant", "mutation": "ITGAL; ITGAX; TMEM119; multi-gene panels", "status_note": "WO record shown pending; not durvalumab-specific in the rapid screen", "url": "https://patents.google.com/patent/WO2024234348A1/en"}];const labels={compound:'化合物',formulation:'制剂',indication:'适应症/联合',resistance:'耐药/突变'};const statuses={grant:'授权记录',pending:'公开/审查中',watch:'观察项'};const q=id=>document.getElementById(id);function filtered(){const t=q('theme').value,j=q('juris').value,s=q('status').value;return data.filter(x=>(t==='all'||x.theme===t)&&(j==='all'||x.juris.includes(j))&&(s==='all'||x.status===s))}function render(){const rows=filtered(),res=rows.filter(x=>x.theme==='resistance').length,gr=rows.filter(x=>x.status==='grant').length,js=[...new Set(rows.flatMap(x=>x.juris))].length;q('metrics').innerHTML=[['可见专利族',rows.length],['授权记录',gr],['耐药/突变族',res],['覆盖法域',js]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');q('families').innerHTML=rows.map(x=>`<tr><td><strong>${x.id}</strong></td><td><a href="${x.url||'#'}" target="_blank" rel="noreferrer">${x.doc||'—'}</a></td><td><span class="tag ${x.theme==='resistance'?'teal':x.theme==='watch'?'amber':''}">${labels[x.theme]||x.theme}</span><br>${x.title}</td><td>${x.year}</td><td>${x.juris.join(' / ')||'—'}</td><td>${statuses[x.status]||x.status}<br><span class="muted">${x.status_note||''}</span></td><td>${x.applicant||'—'}</td></tr>`).join('')||'<tr><td colspan="7">当前筛选条件没有匹配族。</td></tr>';q('timeline').innerHTML=[...rows].sort((a,b)=>Number(a.year)-Number(b.year)).map(x=>`<div class="tr"><span class="muted">${x.year}</span><div class="track"><span class="dot ${x.theme==='resistance'?'resistance':x.status==='watch'?'watch':''}"></span><span><strong>${x.id}</strong> ${x.title} <span class="muted">${x.applicant||''}</span></span></div></div>`).join('')||'<p class="muted">当前筛选条件没有匹配事件。</p>'}['theme','juris','status'].forEach(id=>q(id).addEventListener('change',render));render();</script></body></html>
