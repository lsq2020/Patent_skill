<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="状态信号分布">
<title>状态信号分布</title>
<rect width="760" height="280" rx="16" fill="#ffffff"/>
<text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#17233b">状态信号分布</text>
<text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#71809a">把官方状态和状态来源文字归入研究阶段信号，不替代官方法律状态。</text>
<text x="28" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">公开/待审查</text>
<rect x="210" y="77" width="466" height="18" rx="9" fill="#edf2fa"/>
<rect x="210" y="77" width="466.0" height="18" rx="9" fill="#e3655b"/>
<text x="706" y="90" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#17233b">2</text>
<text x="28" y="124" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">待官方核验</text>
<rect x="210" y="111" width="466" height="18" rx="9" fill="#edf2fa"/>
<rect x="210" y="111" width="466.0" height="18" rx="9" fill="#6d7892"/>
<text x="706" y="124" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#17233b">2</text>
<text x="28" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">失效/放弃信号</text>
<rect x="210" y="145" width="466" height="18" rx="9" fill="#edf2fa"/>
<rect x="210" y="145" width="233.0" height="18" rx="9" fill="#4ab39a"/>
<text x="706" y="158" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#17233b">1</text>
<text x="28" y="192" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">授权/状态较强</text>
<rect x="210" y="179" width="466" height="18" rx="9" fill="#edf2fa"/>
<rect x="210" y="179" width="233.0" height="18" rx="9" fill="#1264d9"/>
<text x="706" y="192" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#17233b">1</text>
<text x="28" y="226" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#44536c">未分类</text>
<rect x="210" y="213" width="466" height="18" rx="9" fill="#edf2fa"/>
<rect x="210" y="213" width="233.0" height="18" rx="9" fill="#3c8eea"/>
<text x="706" y="226" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#17233b">1</text>
</svg>